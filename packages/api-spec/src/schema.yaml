openapi: '3.1.1'
info:
  title: ASSETTY API
  version: '1.0'
servers:
  - url: http://localhost:8787/api
paths:
  # ====================================================================================================
  # ログイン
  # ====================================================================================================
  /auth/login:
    post:
      summary: ログイン
      requestBody:
        $ref: '#/components/requestBodies/LoginRequestBody'
      responses:
        '200':
          description: ログイン成功
          headers:
            Set-Cookie:
              schema:
                type: string
              description: アクセストークン（JWT）を HttpOnly Cookie にセット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          description: ログイン失敗（ユーザーが存在しないか、パスワードが正しくない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentialsErrorResponse'
  # ====================================================================================================
  # ログアウト
  # ====================================================================================================
  /auth/logout:
    post:
      summary: ログアウト
      responses:
        '204':
          description: ログアウト成功
          headers:
            Set-Cookie:
              schema:
                type: string
              description: アクセストークン（JWT）を Cookie から削除
  # ====================================================================================================
  # 認証チェック
  # ====================================================================================================
  /auth/check:
    get:
      summary: 認証チェック
      security:
        - AccessTokenCookieAuth: []
      responses:
        '200':
          description: 認証成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCheckResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  # ====================================================================================================
  # ユーザー情報取得
  # ====================================================================================================
  /user:
    get:
      summary: ユーザー情報取得
      security:
        - AccessTokenCookieAuth: []
      responses:
        '200':
          description: ユーザー情報取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  # ====================================================================================================
  # 月次の資産情報取得
  # ====================================================================================================
  /assets/monthly:
    get:
      summary: 月次の資産情報取得
      security:
        - AccessTokenCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/BaseDateQueryParameter'
      responses:
        '200':
          description: 月次の資産情報取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  # ====================================================================================================
  # 年次の資産情報取得
  # ====================================================================================================
  /assets/yearly:
    get:
      summary: 年次の資産情報取得
      security:
        - AccessTokenCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/BaseDateQueryParameter'
      responses:
        '200':
          description: 年次の資産情報取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetInfoResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  # ====================================================================================================
  # 資産カテゴリの取得
  # ====================================================================================================
  /assets/categories:
    get:
      summary: 資産カテゴリの取得
      security:
        - AccessTokenCookieAuth: []
      responses:
        '200':
          description: 資産カテゴリの取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetCategoryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
  # ====================================================================================================
  # 資産データ登録
  # ====================================================================================================
  /assets:
    post:
      summary: 月次の資産データ登録
      security:
        - AccessTokenCookieAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateAssetRecordsRequestBody'
      responses:
        '201':
          description: 資産データ登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAssetRecordsSuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '500':
          description: 資産データ登録失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsRegistrationFailedErrorResponse'

components:
  requestBodies:
    LoginRequestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: ログイン のリクエストボディ
            properties:
              name:
                type: string
                description: ユーザー名
              password:
                type: string
                description: パスワード
            required:
              - name
              - password
    CreateAssetRecordsRequestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            description: 月次の資産データ登録 のリクエストボディ
            items:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: 基準日（YYYY-MM-DD形式）
                amount:
                  type: number
                  description: 資産額
                assetCategoryId:
                  type: number
                  description: 資産カテゴリID
              required:
                - date
                - amount
                - assetCategoryId

  parameters:
    BaseDateQueryParameter:
      name: baseDate
      in: query
      description: 基準日（YYYY-MM-DD形式）
      required: true
      schema:
        type: string
        format: date

  responses:
    UnauthorizedErrorResponse:
      description: 認証チェック失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidAccessTokenErrorResponse'
    ValidationErrorResponse:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    ErrorResponse:
      description: エラー種別ごとのレスポンスを包含する共通型
      oneOf:
        - $ref: '#/components/schemas/ValidationErrorResponse'
        - $ref: '#/components/schemas/InvalidCredentialsErrorResponse'
        - $ref: '#/components/schemas/InvalidAccessTokenErrorResponse'
        - $ref: '#/components/schemas/NotFoundErrorResponse'
        - $ref: '#/components/schemas/AssetsRegistrationFailedErrorResponse'
        - $ref: '#/components/schemas/InternalServerErrorResponse'
    ValidationErrorResponse:
      type: object
      description: バリデーションエラー
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR]
        message:
          type: string
          enum: [Validation Error]
        status:
          type: integer
          enum: [400]
      required: [code, message, status]
    InvalidCredentialsErrorResponse:
      type: object
      description: 認証失敗（ユーザーが存在しないか、パスワードが正しくない）
      properties:
        code:
          type: string
          enum: [INVALID_CREDENTIALS]
        message:
          type: string
          enum: [Invalid Credentials]
        status:
          type: integer
          enum: [401]
      required: [code, message, status]
    InvalidAccessTokenErrorResponse:
      type: object
      description: 認証失敗（無効なアクセストークン）
      properties:
        code:
          type: string
          enum: [INVALID_ACCESS_TOKEN]
        message:
          type: string
          enum: [Invalid Access Token]
        status:
          type: integer
          enum: [401]
      required: [code, message, status]
    NotFoundErrorResponse:
      type: object
      description: リソースが見つからない
      properties:
        code:
          type: string
          enum: [NOT_FOUND]
        message:
          type: string
          enum: [Not Found]
        status:
          type: integer
          enum: [404]
      required: [code, message, status]
    AssetsRegistrationFailedErrorResponse:
      type: object
      description: 資産情報の登録失敗
      properties:
        code:
          type: string
          enum: [ASSETS_REGISTRATION_FAILED]
        message:
          type: string
          enum: [Assets Registration Failed]
        status:
          type: integer
          enum: [500]
      required: [code, message, status]
    InternalServerErrorResponse:
      type: object
      description: 予期しない内部サーバーエラー（どれにも該当しない場合に返す）
      properties:
        code:
          type: string
          enum: [INTERNAL_SERVER_ERROR]
        message:
          type: string
          enum: [Internal Server Error]
        status:
          type: integer
          enum: [500]
      required: [code, message, status]
    LoginSuccessResponse:
      type: object
      description: ログイン成功時のレスポンス
      properties:
        name:
          type: string
          description: ユーザー名
      required:
        - name
    AuthCheckResponse:
      type: object
      description: 認証チェック成功時のレスポンス
      properties:
        ok:
          type: boolean
          description: 認証チェック成功を表す真偽値
          enum:
            - true
      required:
        - ok
    UserInfoResponse:
      type: object
      description: ユーザー情報取得レスポンス
      properties:
        id:
          type: string
          description: ユーザーID
        name:
          type: string
          description: ユーザー名
      required:
        - id
        - name
    AssetCategoryResponse:
      type: object
      description: 資産カテゴリ
      properties:
        id:
          type: number
          description: 資産カテゴリID
        name:
          type: string
          description: 資産カテゴリ名
      required:
        - id
        - name
    AssetAllocationSchema:
      type: object
      description: 資産内訳
      properties:
        category:
          type: string
          description: 資産カテゴリ名
        amount:
          type: number
          description: カテゴリーの資産額
        rate:
          type: number
          description: 全体に占める割合（%）
      required:
        - category
        - amount
        - rate
    AssetInfoResponse:
      type: object
      description: 資産情報レスポンス
      properties:
        yearMonth:
          type: string
          description: 年月（YYYY-MM形式）
        totalAssets:
          type: number
          description: その年月の合計資産額
        assetsByCategories:
          type: array
          description: カテゴリー別の資産情報
          items:
            $ref: '#/components/schemas/AssetAllocationSchema'
      required:
        - yearMonth
        - totalAssets
        - assetsByCategories
    CreateAssetRecordsSuccessResponse:
      type: object
      description: 資産データ登録成功時のレスポンス
      properties:
        ok:
          type: boolean
          description: 資産データ登録の成功を表す真偽値
          enum:
            - true
      required:
        - ok

  securitySchemes:
    AccessTokenCookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 認証チェック用JWT。ログイン成功時に発行され、以降のリクエストではHttpOnly属性のCookie（access_token）として自動送信される。
